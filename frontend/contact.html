<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>聯絡我們 · 三渡棧 Mementos（暫定名稱）</title>
<meta name="description" content="有查詢、合作意向，或純粹想了解多一點？歡迎聯絡我們。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;600;700&family=Noto+Serif+HK:wght@600;700&family=Special+Elite&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cormorant+Garamond:wght@400;600&family=EB+Garamond:ital@0;1&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="stampRough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"></feDisplacementMap>
  </filter>
</svg>

<a class="skip-link" href="#main" data-i18n="skip.toMain">跳到主要內容</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo-placeholder.svg" alt="三渡棧 Mementos — 暫定郵戳標記" width="120" height="36">
      <span class="brand-sub" data-i18n="nav.brandSub">生死晚餐 · Memento Amoris</span>
    </a>
    <div class="header-actions">
      <button class="lang-toggle" id="lang-toggle" type="button" aria-pressed="false">
        <span id="lang-toggle-label" data-i18n="nav.langToggle">EN</span>
      </button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span data-i18n="nav.menuToggle">選單</span>
      </button>
    </div>
    <nav id="nav-menu" class="nav-menu" aria-label="主要導覽">
      <a href="about.html" data-i18n="nav.aboutUs">關於我們</a>
      <a href="service.html" data-i18n="nav.service">服務</a>
      <a href="education.html" data-i18n="nav.publicEducation">生死教育</a>
      <a href="contact.html" aria-current="page" data-i18n="nav.contactUs">聯絡我們</a>
      <a href="join.html" data-i18n="nav.joinUs">加入我們</a>
      <a class="btn btn-primary" href="wizard.html" data-i18n="nav.cta">開始籌備</a>
    </nav>
  </div>
</header>

<main id="main">
  <section>
    <div class="container">
      <h1 class="section-title" data-i18n="contact.hero.title">聯絡我們</h1>
      <p class="section-subtitle" data-i18n="contact.hero.subtitle">…</p>

      <div class="margin-notes notes-grid-3">
        <div class="note-card">
          <h3 data-i18n="contact.email.label">電郵</h3>
          <p data-i18n="contact.email.pending">待補充</p>
        </div>
        <div class="note-card">
          <h3 data-i18n="contact.phone.label">電話</h3>
          <p data-i18n="contact.phone.pending">待補充</p>
        </div>
        <div class="note-card">
          <h3 data-i18n="contact.address.label">地址</h3>
          <p data-i18n="contact.address.pending">待補充</p>
        </div>
      </div>

      <p class="centered-copy mt-space-4" data-i18n="contact.note">…</p>
    </div>
  </section>

  <section class="section-alt" id="enquiry">
    <div class="container">
      <h2 class="section-title" data-i18n="contact.form.title">網上查詢</h2>
      <p class="section-subtitle" data-i18n="contact.form.intro">…</p>

      <form class="enquiry-form" id="enquiry-form" novalidate>
        <div class="field-grid">
          <div class="field">
            <label for="enquiry-name" data-i18n="contact.form.name">姓名</label>
            <input id="enquiry-name" name="name" type="text" autocomplete="name" maxlength="200" required>
          </div>
          <div class="field">
            <label for="enquiry-email" data-i18n="contact.form.email">電郵</label>
            <input id="enquiry-email" name="email" type="email" autocomplete="email" maxlength="254" required>
          </div>
          <div class="field">
            <label for="enquiry-phone" data-i18n="contact.form.phone">電話（選填）</label>
            <input id="enquiry-phone" name="phone" type="tel" autocomplete="tel" maxlength="50">
          </div>
          <div class="field">
            <label for="enquiry-type" data-i18n="contact.form.type">查詢類別</label>
            <select id="enquiry-type" name="type">
              <option value="general" data-i18n="contact.form.type.general">一般查詢</option>
              <option value="dinner" data-i18n="contact.form.type.dinner">籌備生死晚餐</option>
              <option value="education" data-i18n="contact.form.type.education">生死教育活動</option>
              <option value="partnership" data-i18n="contact.form.type.partnership">合作／傳媒</option>
              <option value="volunteer" data-i18n="contact.form.type.volunteer">義工及團隊招募</option>
            </select>
          </div>
        </div>

        <div class="field enquiry-message">
          <label for="enquiry-message" data-i18n="contact.form.message">查詢內容</label>
          <textarea id="enquiry-message" name="message" rows="6" maxlength="5000" required data-i18n-placeholder="contact.form.messagePlaceholder"></textarea>
        </div>

        <div class="enquiry-consent">
          <input type="checkbox" id="enquiry-consent" name="consent" required>
          <label for="enquiry-consent" data-i18n="contact.form.consent">我明白以上資料只會用作回覆今次查詢。</label>
        </div>

        <p class="wizard-error" id="enquiry-error" aria-live="assertive"></p>
        <div class="enquiry-actions">
          <button class="btn btn-primary" type="submit" id="enquiry-submit" data-i18n="contact.form.submit">送出查詢</button>
          <p class="send-status" id="enquiry-status" role="status" aria-live="polite"></p>
        </div>
      </form>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-brand-row">
      <div class="footer-logo-placeholder">
        <img src="assets/logo-placeholder.svg" alt="三渡棧 Mementos — 暫定郵戳標記" width="120" height="36">
        <span class="brand-sub" data-i18n="footer.brandSub">生死晚餐 · Memento Amoris</span>
      </div>
      <nav class="footer-links" aria-label="頁尾連結" data-i18n-aria-label="footer.linksLabel">
        <a class="footer-link-btn" href="contact.html" data-i18n="nav.contactUs">聯絡我們</a>
        <a class="footer-link-btn" href="join.html" data-i18n="nav.joinUs">加入我們</a>
      </nav>
    </div>
    <p class="footer-legal" data-i18n="footer.legal">…</p>
    <div class="footer-meta">
      <span data-i18n="footer.contactPending">聯絡方法：待補充</span>
      <button class="theme-toggle" id="theme-toggle" type="button">
        <span id="theme-toggle-label" data-i18n="nav.themeToggle.toWestern">轉為西式風格</span>
      </button>
      <span id="footer-copyright"></span>
    </div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
<script src="js/back-to-top.js"></script>
<script src="js/enquiry.js"></script>
</body>
</html>
