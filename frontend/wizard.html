<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>開始籌備 · 三渡棧 Mementos（暫定名稱）</title>
<meta name="description" content="回答幾條問題，我們幫你組合一份可以即刻送出的邀請函。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+HK:wght@400;600;700&family=Noto+Serif+HK:wght@600;700&family=Special+Elite&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Cormorant+Garamond:wght@400;600&family=EB+Garamond:ital@0;1&family=LXGW+WenKai+TC:wght@400;700&family=Caveat:wght@400;600;700&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="stampRough" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" result="noise" seed="7"></feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="3"></feDisplacementMap>
  </filter>
</svg>

<a class="skip-link" href="#main" data-i18n="skip.toMain">跳到主要內容</a>

<header class="site-header">
  <div class="container">
    <a class="brand" href="index.html">
      <img src="assets/logo-placeholder.svg" alt="三渡棧 Mementos — 暫定郵戳標記" width="120" height="36">
      <span class="brand-sub" data-i18n="nav.brandSub">生死晚餐 · Memento Amoris</span>
    </a>
    <div class="header-actions">
      <button class="lang-toggle" id="lang-toggle" type="button" aria-pressed="false">
        <span id="lang-toggle-label" data-i18n="nav.langToggle">EN</span>
      </button>
      <button class="nav-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-menu">
        <span data-i18n="nav.menuToggle">選單</span>
      </button>
    </div>
    <nav id="nav-menu" class="nav-menu" aria-label="主要導覽">
      <a href="about.html" data-i18n="nav.aboutUs">關於我們</a>
      <a href="service.html" data-i18n="nav.service">服務</a>
      <a href="education.html" data-i18n="nav.publicEducation">生死教育</a>
      <a href="contact.html" data-i18n="nav.contactUs">聯絡我們</a>
      <a href="join.html" data-i18n="nav.joinUs">加入我們</a>
      <a class="btn btn-primary" href="wizard.html" aria-current="page" data-i18n="nav.cta">開始籌備</a>
    </nav>
  </div>
</header>

<main id="main">
  <section id="wizard">
    <div class="container">

      <!-- Item 7: legal/ethics boundary + grief/crisis precaution, shown
           before the questionnaire becomes reachable at all. -->
      <div id="wizard-gate" class="gate-panel">
        <h1 class="section-title" data-i18n="gate.title">在開始問卷之前</h1>
        <p class="section-subtitle" data-i18n="gate.subtitle">…</p>

        <div class="legal-box">
          <h3 data-i18n="gate.legal.title">法律及倫理界線</h3>
          <div data-i18n="gate.legal.body" data-i18n-html>…</div>
        </div>

        <div class="gate-precaution">
          <h3 data-i18n="gate.precaution.title">重要提示：如你現時正經歷以下情況</h3>
          <p data-i18n="gate.precaution.body">…</p>
          <p data-i18n="gate.precaution.urgency">…</p>
          <ul>
            <li data-i18n="gate.crisis.line1">…</li>
            <li data-i18n="gate.crisis.line2">…</li>
            <li data-i18n="gate.crisis.line3">…</li>
          </ul>
          <p class="small muted" data-i18n="gate.precaution.reference">…</p>
        </div>

        <div class="gate-ack">
          <input type="checkbox" id="gate-ack-checkbox">
          <label for="gate-ack-checkbox" data-i18n="gate.ack.label">…</label>
        </div>
        <p id="gate-error" class="wizard-error" aria-live="assertive"></p>
        <div class="gate-actions">
          <button class="btn btn-primary" id="gate-start" type="button" data-i18n="gate.start">我準備好了，開始問卷</button>
        </div>
      </div>

      <div id="wizard-panel-wrap" hidden>
        <h2 class="section-title" data-i18n="wizard.title">開始籌備你的生死晚餐</h2>
        <p class="section-subtitle" data-i18n="wizard.subtitle">…</p>

        <div class="wizard-panel">
          <div class="wizard-progress-track">
            <div class="wizard-progress-bar" id="wizard-progress-bar"></div>
            <span class="wizard-progress-plane" id="wizard-progress-plane" aria-hidden="true">&#9992;</span>
          </div>
          <p class="wizard-progress-text" id="wizard-progress-text"></p>

          <div id="wizard-live" class="sr-only" aria-live="polite"></div>
          <p id="wizard-error" class="wizard-error" aria-live="assertive"></p>

          <div id="wizard-step-content"></div>

          <div class="wizard-nav">
            <button class="btn btn-secondary" id="wizard-back" type="button" data-i18n="wizard.back">上一步</button>
            <button class="btn btn-primary" id="wizard-next" type="button">下一步</button>
          </div>
        </div>
      </div>

    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="container">
    <div class="footer-logo-placeholder">
      <img src="assets/logo-placeholder.svg" alt="三渡棧 Mementos — 暫定郵戳標記" width="120" height="36">
      <span class="brand-sub" data-i18n="footer.brandSub">生死晚餐 · Memento Amoris</span>
    </div>
    <p class="footer-legal" data-i18n="footer.legal">…</p>
    <div class="footer-meta">
      <span data-i18n="footer.contactPending">聯絡方法：待補充</span>
      <button class="theme-toggle" id="theme-toggle" type="button">
        <span id="theme-toggle-label" data-i18n="nav.themeToggle.toWestern">轉為西式風格</span>
      </button>
      <span id="footer-copyright"></span>
    </div>
  </div>
</footer>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/wizard.js"></script>
<script src="js/whatsapp.js"></script>
<script src="js/app.js"></script>
<script src="js/gate.js"></script>
</body>
</html>
